<script>
(()=>{
'use strict';
const W=1920,H=1080,FPS=60,DUR=15;
const RENDER=/[?&]render/.test(location.search);
if(RENDER) document.body.classList.add('render');

/* ---------- palette & type (taken from the site's :root tokens) ---------- */
const C={bg:'#0a0d18',surface:'#11162a',surface2:'#171d35',line:'#262f4d',lineSoft:'#1c2440',fg:'#e8ebf5',muted:'#9aa3bf',faint:'#6a7393',
  blue:'#3d9bff',amber:'#ffb02e',red:'#ff5c5c',green:'#7bd86f',purple:'#b892ff',pre:'#8ea2c4',pink:'#ff6fae',teal:'#2fd2c4',gold:'#f2d36b',ok:'#7bd86f',bad:'#ff6b6b'};
const DISP='"Spectral", Georgia, serif', BODY='"IBM Plex Sans", system-ui, sans-serif', MONO='"IBM Plex Mono", ui-monospace, monospace';

/* ---------- maths ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const bell=(t,a,b)=>{const p=prog(t,a,b);return Math.sin(Math.PI*p)};
const E={
  inCubic:x=>x*x*x, outCubic:x=>1-Math.pow(1-x,3), inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  inQuad:x=>x*x, outQuad:x=>1-(1-x)*(1-x), inOutSine:x=>-(Math.cos(Math.PI*x)-1)/2,
  outQuint:x=>1-Math.pow(1-x,5), inOutQuint:x=>x<.5?16*x*x*x*x*x:1-Math.pow(-2*x+2,5)/2,
  inExpo:x=>x<=0?0:Math.pow(2,10*x-10), outExpo:x=>x>=1?1:1-Math.pow(2,-10*x),
  outBack:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(a,b){let h=Math.imul((a|0)^0x9e3779b9,0x85ebca6b)^Math.imul((b|0)+0x632be5ab,0xc2b2ae35);h^=h>>>15;h=Math.imul(h,0x2c1b3c6d);h^=h>>>12;return (h>>>0)/4294967296}
const _rgb={};
function rgb(hex){if(_rgb[hex])return _rgb[hex];const n=parseInt(hex.slice(1),16);return _rgb[hex]=[n>>16&255,n>>8&255,n&255]}
function rgba(hex,a){const c=rgb(hex);return `rgba(${c[0]},${c[1]},${c[2]},${a<0?0:a>1?1:a})`}
function mixA(h1,h2,t){const p=Array.isArray(h1)?h1:rgb(h1),q=Array.isArray(h2)?h2:rgb(h2);return p.map((v,i)=>v+(q[i]-v)*t)}
function mix(h1,h2,t,a=1){const p=Array.isArray(h1)?h1:rgb(h1),q=Array.isArray(h2)?h2:rgb(h2);return `rgba(${Math.round(p[0]+(q[0]-p[0])*t)},${Math.round(p[1]+(q[1]-p[1])*t)},${Math.round(p[2]+(q[2]-p[2])*t)},${a})`}
function glow(ctx,x,y,r,hex,a,mid=.42){if(a<=.002||r<=.5)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(hex,a));g.addColorStop(.22,rgba(hex,a*mid));g.addColorStop(1,rgba(hex,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r)}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

/* ---------- typography ---------- */
const GLY='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
// Mono eyebrow that decodes from scrambled glyphs, one character at a time.
function eyebrow(ctx,parts,x,y,t,t0,o={}){
  const size=o.size||20, cps=o.cps||.016;
  let a=1; if(o.out) a=1-E.inCubic(prog(t,o.out[0],o.out[0]+o.out[1])); if(a<=0||t<t0-.1) return;
  ctx.save(); ctx.globalAlpha*=a; ctx.font=`500 ${size}px ${MONO}`; ctx.letterSpacing=(size*.14).toFixed(2)+'px'; ctx.textBaseline='alphabetic';
  const chars=[]; for(const p of parts) for(const ch of p.s) chars.push({ch,c:p.c});
  const adv=ctx.measureText('0000000000').width/10;
  const tw=adv*chars.length; const ox=o.align==='right'?x-tw:o.align==='center'?x-tw/2:x;
  const dy=o.out?-14*E.inCubic(prog(t,o.out[0],o.out[0]+o.out[1])):0;
  chars.forEach((c,i)=>{const ti=t0+i*cps; if(t<ti-.14) return; let ch=c.ch, col=c.c;
    if(t<ti&&ch!==' '){ch=GLY[Math.floor(hash(i*7+3,Math.floor(t*36))*GLY.length)];col=C.faint}
    ctx.fillStyle=col; ctx.fillText(ch,ox+i*adv,y+dy)});
  ctx.restore();
}
function drawArrow(ctx,x,y,w,size,col){const m=y-size*.3,lw=Math.max(1.5,size*.07),hs=size*.24;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x+size*.08,m);ctx.lineTo(x+w-size*.12,m);ctx.moveTo(x+w-size*.12-hs,m-hs);ctx.lineTo(x+w-size*.12,m);ctx.lineTo(x+w-size*.12-hs,m+hs);ctx.stroke();ctx.restore()}
// Rich line: segments {s, f(font), c(colour), glow}; words rise in with a blur, stagger, then optionally exit.
function layoutLine(ctx,segs){const words=[];let cx=0;
  for(const sg of segs){ctx.font=sg.f;ctx.letterSpacing=sg.ls||'0px';const size=parseFloat(sg.f.match(/(\d+(?:\.\d+)?)px/)[1]);

      if(tk==='→'){const w=size*.95;words.push({tk,x:cx,w,sg,arrow:size});cx+=w;continue}

  if(t<t0) return 0;
  const L=layoutLine(ctx,segs); const ox=o.align==='center'?x-L.width/2:o.align==='right'?x-L.width:x;
  L.words.forEach((wd,i)=>{
    const p=E.outCubic(prog(t,t0+i*st,t0+i*st+d)); if(p<=0) return;
    let a=p,dy=(1-p)*rise,bl=(1-p)*blur;
    if(o.out){const q=E.inCubic(prog(t,o.out[0]+i*st*.4,o.out[0]+i*st*.4+o.out[1]));a*=1-q;dy-=q*rise*.7;bl+=q*blur}

    if(wd.arrow){drawArrow(ctx,ox+wd.x,y+dy,wd.w,wd.arrow,wd.sg.c);ctx.restore();return}
    ctx.font=wd.sg.f; ctx.letterSpacing=wd.sg.ls||'0px'; ctx.fillStyle=wd.sg.c; ctx.textBaseline='alphabetic';
    if(wd.sg.glow){const g=typeof wd.sg.glow==='function'?wd.sg.glow(t):wd.sg.glow; if(g&&g[1]>0){ctx.shadowColor=rgba(g[0],g[1]);ctx.shadowBlur=g[2]||28}}

    ctx.restore();
  });

}
// Fixed-cell numerals so changing counters do not jitter.
function tabular(ctx,str,x,y,font,col,cell,align='left'){
  ctx.save();ctx.font=font;ctx.fillStyle=col;ctx.textBaseline='alphabetic';ctx.textAlign='center';
  const ws=[...str].map(ch=>/[0-9]/.test(ch)?cell:ctx.measureText(ch).width+cell*.08); const tw=ws.reduce((a,b)=>a+b,0);
  let cx=align==='right'?x-tw:align==='center'?x-tw/2:x;
  [...str].forEach((ch,i)=>{ctx.fillText(ch,cx+ws[i]/2,y);cx+=ws[i]});ctx.restore();return tw}
function label(ctx,s,x,y,font,col,a=1,align='left',ls='0px'){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.font=font;ctx.letterSpacing=ls;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);ctx.restore()}
// Ion label with a drawn superscript (the web fonts carry no superscript glyphs).
function ionLabel(ctx,base,sup,x,y,col,size=16){ctx.save();ctx.font=`500 ${size}px ${MONO}`;ctx.fillStyle=col;ctx.fillText(base,x,y);const w=ctx.measureText(base).width;ctx.font=`500 ${size*.68}px ${MONO}`;ctx.fillText(sup,x+w+1,y-size*.42);ctx.restore()}
// Callout: anchor dot, elbow leader drawn on, then a mono label.
function callout(ctx,ax,ay,lx,ly,p,title,sub,col,o={}){
  if(p<=0)return; const a=o.a??1; ctx.save(); ctx.globalAlpha*=a;
  const ex=lx+(o.left?18:-18); const pts=[[ax,ay],[ex,ly],[lx+(o.left?6:-6),ly]];
  const seg=[Math.hypot(pts[1][0]-pts[0][0],pts[1][1]-pts[0][1]),Math.hypot(pts[2][0]-pts[1][0],0)]; const tot=seg[0]+seg[1]; let rem=tot*E.outCubic(clamp(p*1.6));
  ctx.strokeStyle=rgba(col,.8);ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(ax,ay);
  for(let i=0;i<2;i++){const f=clamp(rem/seg[i]);ctx.lineTo(lerp(pts[i][0],pts[i+1][0],f),lerp(pts[i][1],pts[i+1][1],f));rem-=seg[i];if(rem<=0)break}
  ctx.stroke(); ctx.fillStyle=col; ctx.beginPath(); ctx.arc(ax,ay,4.5*E.outBack(clamp(p*3)),0,7); ctx.fill();
  ctx.strokeStyle=rgba(col,.5*(1-clamp(p*1.4)));ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(ax,ay,4+26*E.outCubic(clamp(p*1.4)),0,7);ctx.stroke();
  const q=E.outCubic(prog(p,.45,1)); if(q>0){
    label(ctx,title,lx,ly+6+(1-q)*10,`500 17px ${MONO}`,C.fg,q,o.left?'right':'left','2.2px');
    if(sub) label(ctx,sub,lx,ly+34+(1-q)*10,`400 19px ${BODY}`,C.muted,q,o.left?'right':'left');
  }
  ctx.restore();
}

/* ---------- data from the site ---------- */
const LANES=[{id:'algae',name:'Algal phototaxis',c:C.green},{id:'rhod',name:'Microbial rhodopsins',c:C.purple},{id:'pre',name:'Early light control',c:C.pre},{id:'chr',name:'ChR → optogenetics',c:C.blue},{id:'tool',name:'Expanding toolbox',c:C.amber},{id:'circ',name:'Circuits & behaviour',c:C.pink},{id:'clin',name:'Clinic',c:C.teal},{id:'cred',name:'Recognition',c:C.gold}];
const EVD=[["algae",1866,0,"Famintzin",0],["rhod",1971,0,"bR",1],["pre",1971,0,"",-1],["rhod",1973,0,"",-1],["rhod",1977,0,"",-1],["algae",1978,0,"",-1],["pre",1979,0,"Crick",2],["algae",1980,0,"",-1],["rhod",1981,0,"",-1],["pre",1983,0,"",-1],["algae",1984,0,"",-1],["rhod",1986,0,"",-1],["algae",1990,0,"",-1],["algae",1991,0,"μs current",0],["algae",1992,0,"",-1],["rhod",1995,0,"",-1],["pre",1999,0,"",-1],["algae",2000,0,"",-1],["algae",2001,0,"",-1],["pre",2002,1,"",-1],["algae",2002,4,"",-1],["chr",2002,6,"ChR1",0],["algae",2003,0,"",-1],["chr",2003,11,"ChR2",1],["chr",2004,2,"",-1],["pre",2004,11,"",-1],["chr",2004,8,"",-1],["chr",2004,11,"",-1],["pre",2005,4,"",-1],["chr",2005,5,"",-1],["chr",2005,8,"Neurons",2],["chr",2005,11,"",-1],["chr",2006,3,"",-1],["pre",2006,0,"",-1],["chr",2006,10,"",-1],["chr",2006,11,"“Optogenetics”",0],["clin",2006,4,"",-1],["chr",2007,9,"",-1],["tool",2007,4,"NpHR",1],["tool",2007,3,"",-1],["circ",2007,11,"",-1],["tool",2010,0,"",-1],["clin",2010,0,"",-1],["circ",2011,0,"",-1],["circ",2011,2,"",-1],["circ",2012,3,"Engram",2],["circ",2012,11,"",-1],["circ",2013,7,"",-1],["circ",2013,4,"",-1],["cred",2013,3,"Brain Prize",0],["tool",2014,4,"",-1],["tool",2014,2,"",-1],["circ",2014,5,"",-1],["tool",2015,8,"",-1],["cred",2015,11,"",-1],["cred",2016,3,"",-1],["clin",2016,0,"First human",1],["cred",2016,9,"",-1],["circ",2018,0,"",-1],["circ",2018,1,"",-1],["cred",2021,9,"",-1],["clin",2021,2,"",-1],["clin",2021,5,"Vision",0],["cred",2026,10,"Nobel",1]];
const BRAIN_OUTLINE='M60 172 C48 140 80 118 112 128 C132 82 205 46 292 46 C372 46 422 70 442 110 C474 98 522 116 526 160 C530 200 506 224 482 228 C502 248 540 268 562 290 L548 306 C512 286 472 272 440 270 C400 286 330 296 270 292 C200 290 150 262 120 222 C98 216 70 206 60 172 Z';
const REG={M1:[190,82,'motor ctx'],DG:[300,112,'DG'],vHPC:[340,180,'vHPC'],BLA:[290,212,'BLA'],CeA:[250,224,'CeA'],NAc:[148,196,'NAc'],BNST:[196,178,'BNST'],LH:[228,248,'LH'],VMH:[262,276,'VMHvl'],MPOA:[175,256,'MPOA'],VTA:[332,252,'VTA'],LHb:[300,148,'LHb'],LDT:[408,232,'LDT'],MLR:[380,206,'MLR']};

/* ---------- master timing (seconds) ---------- */
const TM={lightOn:.08, callout:.95, textOut:1.42, zoom0:1.66, zoom1:2.66,
  s2in:2.5, photon0:2.92, hit:3.5, whip1:[4.85,5.3],
  play0:5.32, play1:6.95, conv0:7.0, conv1:7.7,
  sweep0:8.05, sweep1:10.0, zo0:10.0, zo1:10.55,
  beats:[10.58,10.94,11.28], whip2:[11.5,11.85],
  beam0:11.76, beamHit:12.12, flash:12.55, fin:12.62};

/* ===================================================================
   SCENE 1 · 1866: Chlamydomonas swims toward light, zoom to the eyespot
   =================================================================== */
const BASE=1.6, HERO_S=1.35;
function makeSwarm(seed,N,L,dur,lightFn,area){
  const rnd=mulberry32(seed), HZ=240, ticks=Math.ceil(dur*HZ)+2, cells=[];
  for(let i=0;i<N;i++) cells.push({x:area[0]+rnd()*area[2],y:area[1]+rnd()*area[3],a:rnd()*6.283,v:.6+rnd()*.6,ph:rnd()*6.283,s:.8+rnd()*.5,z:.55+rnd()*.6});
  const st=new Float32Array(ticks*N*4);
  for(let k=0;k<ticks;k++){const t=k/HZ, I=lightFn(t);
    for(let i=0;i<N;i++){const c=cells[i];
      if(k>0){const dx=L.x-c.x,dy=L.y-c.y,target=Math.atan2(dy,dx);let da=((target-c.a+Math.PI*3)%(Math.PI*2))-Math.PI;
        c.a+=da*.0105*I+(rnd()-.5)*.2; c.ph+=.0875; const sp=c.v*(1.3+.5*Math.sin(c.ph))*.62*c.z;
        c.x+=Math.cos(c.a)*sp; c.y+=Math.sin(c.a)*sp;
        if(c.x<-40)c.x=W+40; if(c.x>W+40)c.x=-40; if(c.y<-40)c.y=H+40; if(c.y>H+40)c.y=-40;}
      const o=(k*N+i)*4; st[o]=c.x;st[o+1]=c.y;st[o+2]=c.a;st[o+3]=c.ph;}}

    let x=st[o],y=st[o+1]; const x1=st[p],y1=st[p+1]; if(Math.abs(x1-x)<200&&Math.abs(y1-y)<200){x+=(x1-x)*f;y+=(y1-y)*f}
    let da=st[p+2]-st[o+2]; da=((da+Math.PI*3)%(Math.PI*2))-Math.PI; return {x,y,a:st[o+2]+da*f,ph:st[o+3]+(st[p+3]-st[o+3])*f}}};
}
const L1={x:1370,y:520};
const light1=t=>E.outCubic(prog(t,TM.lightOn,.85));
const SWARM=makeSwarm(1866,170,L1,3.0,light1,[-40,-40,W+80,H+80]);
const H0={x:930,y:792}, HD=(()=>{const dx=L1.x-H0.x,dy=L1.y-H0.y,d=Math.hypot(dx,dy);return {x:dx/d,y:dy/d,a:Math.atan2(dy,dx)}})();
function hero(t){const w=Math.sin(t*2.3)*5, sp=46*t-6*Math.max(0,t-1.6)**2;
  return {x:H0.x+HD.x*sp-HD.y*w, y:H0.y+HD.y*sp+HD.x*w, a:HD.a+.1*Math.sin(t*2.3+1.2), ph:t*21}}

}

  if(t>=TM.whip2[0]&&t<TM.flash+.3) scene6(ctx,t);
  if(t>=TM.flash) scene7(ctx,t);
  chrome(ctx,t);flashes(ctx,t);
  // fade from black at the head
  const fb=1-E.outCubic(prog(t,0,.35));if(fb>0){ctx.fillStyle=`rgba(0,0,0,${fb})`;ctx.fillRect(0,0,W,H)}
}
const cv=document.getElementById('c'),out=cv.getContext('2d');
const sub=document.createElement('canvas');sub.width=W;sub.height=H;const sctx=sub.getContext('2d');
const acc=document.createElement('canvas');acc.width=W;acc.height=H;const actx=acc.getContext('2d');
// grain plates and vignette, applied once per output frame
const GR=[...Array(6)].map((_,k)=>{const c=document.createElement('canvas');c.width=W/2;c.height=H/2;const g=c.getContext('2d'),im=g.createImageData(W/2,H/2),r=mulberry32(99+k);for(let i=0;i<im.data.length;i+=4){const v=Math.floor(r()*256);im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}g.putImageData(im,0,0);return c});
function post(ctx,frame){
  ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.09;ctx.drawImage(GR[frame%GR.length],0,0,W,H);ctx.restore();
  const v=ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*1.05);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
function renderFrame(i,S=3,shutter=.5){
  for(let k=0;k<S;k++){const tk=Math.max(0,Math.min(DUR-1e-4,i/FPS+(S>1?((k+.5)/S-.5)*shutter/FPS:0)));drawScene(sctx,tk);
    actx.globalAlpha=1/(k+1);actx.globalCompositeOperation='source-over';actx.drawImage(sub,0,0)}
  actx.globalAlpha=1;out.globalAlpha=1;out.drawImage(acc,0,0);post(out,i);
}
const CUES={dur:DUR,lightOn:TM.lightOn,callout:TM.callout,textOut:TM.textOut,zoom:[TM.zoom0,TM.zoom1],s2in:TM.s2in,photon:[TM.photon0,TM.hit],hit:TM.hit,
  ions:IONS.map(o=>o.te+.3).sort((a,b)=>a-b),whips:[TM.whip1,TM.whip2],
  pops:TL.ev.map(e=>({t:e.te,lane:LANES.findIndex(l=>l.id===e.l),ms:!!e.k})),conv:[TM.conv0,TM.conv1],
  pulses:SIM.pv,spikes:SIM.sv,amber:[SIM.a0,SIM.a1],sweep:[TM.sweep0,TM.sweep1],zoomOut:[TM.zo0,TM.zo1],beats:TM.beats,
  beam:[TM.beam0,TM.beamHit],flash:TM.flash,fin:TM.fin,names:TM.fin+.85,url:TM.fin+1.4,switchGlow:13.95};
const ready=(async()=>{const specs=[`300 40px ${DISP}`,`italic 300 40px ${DISP}`,`500 20px ${BODY}`,`600 20px ${BODY}`,`400 20px ${BODY}`,`500 20px ${MONO}`,`400 20px ${MONO}`];
  await Promise.all(specs.map(s=>document.fonts.load(s,'Aa1’–·μ')));await document.fonts.ready;})();
window.FILM={W,H,FPS,DUR,renderFrame,drawScene:t=>{drawScene(out,t);post(out,0)},CUES,ready};
if(!RENDER){
  const pp=document.getElementById('pp'),sc=document.getElementById('scrub'),tc=document.getElementById('tc');let playing=true,t0=performance.now(),tt=0;
  pp.onclick=()=>{playing=!playing;pp.textContent=playing?'Pause':'Play';t0=performance.now()-tt*1000};
  sc.oninput=()=>{tt=+sc.value;t0=performance.now()-tt*1000;if(!playing)frame()};
  addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();pp.click()}if(e.key==='ArrowRight'){tt=Math.min(DUR,tt+1/FPS*(e.shiftKey?30:1));t0=performance.now()-tt*1000;frame()}if(e.key==='ArrowLeft'){tt=Math.max(0,tt-1/FPS*(e.shiftKey?30:1));t0=performance.now()-tt*1000;frame()}});
  function frame(){drawScene(out,tt);post(out,Math.floor(tt*FPS));sc.value=tt;tc.textContent=tt.toFixed(2)+' s'}
  ready.then(()=>{(function loop(now){if(playing){tt=((now-t0)/1000)%DUR;frame()}requestAnimationFrame(loop)})(performance.now())});
}
})();
</script>
